<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/jpeg" href="IMG_0681.jpeg">
  <link rel="apple-touch-icon" type="image/jpeg" href="IMG_0681.jpeg">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>DeadShape</title>
<style>
  :root{
    --ui-size:60px;
    --footer-height: 25px; /* Approximate height of the footer */
    --controls-base-offset: calc(var(--footer-height) + 15px); /* Space above footer */
    --controls-side-margin: 12px;
    --controls-button-size: var(--ui-size); /* Standard button size for d-pad */
    --special-button-size: calc(var(--ui-size) * 1.1); /* Slightly larger for action buttons */
    --controls-spacing: 10px; /* Gap between control buttons */
  }
  html,body{height:100%;margin:0;font-family:Inter,Arial; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color: transparent;}
  #gameWrap{position:fixed;inset:0;background:green;display:flex;align-items:stretch;justify-content:center}
  canvas{display:block;width:100%;height:100%;}
  #ui {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .menu {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.8);
    flex-direction:column; gap:12px; z-index:40; font-size:18px; color:#ddd;
  }
  .menu .box {
    background: linear-gradient(135deg, #222, #000);
    padding:20px;
    border-radius:12px;
    text-align:center;
    width:90%;
    max-width:420px;
    box-shadow: 0 0 15px rgba(0,0,0,0.7);
    border: 1px solid rgba(80,80,80,0.5);
  }
  .menu h1 {
    color: #eee;
    text-shadow: 0 0 5px rgba(200,200,200,0.4);
    margin-bottom: 10px;
    font-size: 2.2em;
  }
  .menu button {
    pointer-events:auto;
    font-size:18px;
    padding:10px 16px;
    margin:6px;
    border-radius:8px;
    border: 1px solid rgba(100,100,100,0.6);
    cursor:pointer;
    background: linear-gradient(45deg, #444, #222);
    color: #fff;
    box-shadow: 0 0 8px rgba(0,0,0,0.5);
    transition: all 0.2s ease-in-out;
  }
  .menu button:hover {
    background: linear-gradient(45deg, #555, #333);
    box-shadow: 0 0 12px rgba(0,0,0,0.7);
    transform: translateY(-2px);
  }

  /* Upgrade Menu Specific Styles */
  #upgradeMenu {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.9);
    z-index: 50;
    flex-direction: column;
    gap: 20px;
  }

  #upgradeMenu.active {
    display: flex;
    pointer-events: auto;
  }

  #upgradeMenu .upgrade-title {
    color: #fff;
    font-size: 28px;
    text-shadow: 0 0 10px rgba(100,200,255,0.6);
    margin-bottom: 20px;
  }

  #upgradeMenu .upgrade-container {
    display: flex;
    gap: 30px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .upgrade-option {
    pointer-events: auto;
    background: linear-gradient(135deg, #1a3a52, #0d1f2d);
    border: 2px solid rgba(100,200,255,0.5);
    border-radius: 12px;
    padding: 20px;
    width: 200px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease-in-out;
    color: #aef;
    font-weight: bold;
    box-shadow: 0 0 15px rgba(100,200,255,0.2);
  }

  .upgrade-option:hover {
    transform: scale(1.05);
    border-color: rgba(100,200,255,0.9);
    box-shadow: 0 0 25px rgba(100,200,255,0.5);
    background: linear-gradient(135deg, #2a5a82, #1d3f5d);
  }

  .upgrade-option .name {
    font-size: 20px;
    margin-bottom: 10px;
    color: #fff;
  }

  .upgrade-option .description {
    font-size: 13px;
    color: #8ac;
    margin-bottom: 8px;
  }

  .upgrade-option .chance {
    font-size: 11px;
    color: #666;
    margin-top: 10px;
  }

  .hud {
    position:absolute;
    left:12px;
    top:12px;
    color:#ccc;
    font-weight:bold;
    font-size:18px;
    background: rgba(0,0,0,0.7);
    padding:8px 10px;
    border-radius:8px;
    pointer-events:none;
    border: 1px solid rgba(80,80,80,0.3);
    box-shadow: 0 0 6px rgba(0,0,0,0.4);
  }

  #waveCounter {
    position: absolute;
    right: 12px;
    top: 12px;
    color: #ccc;
    font-weight: bold;
    font-size: 18px;
    background: rgba(0,0,0,0.7);
    padding: 8px 10px;
    border-radius: 8px;
    pointer-events: none;
    border: 1px solid rgba(80,80,80,0.3);
    box-shadow: 0 0 6px rgba(0,0,0,0.4);
  }

  #controls { /* D-pad container (right side) */
    position:absolute;
    right:calc(var(--controls-side-margin) + 30px); /* Moved slightly left */
    bottom:var(--controls-base-offset);
    width: calc(var(--controls-button-size) * 2 + var(--controls-spacing));
    pointer-events:auto;
    display:flex; /* Ensure flex for centering */
    flex-direction: column; /* Stack 'up' and 'left/down/right' */
    align-items: center; /* Center horizontally */
    gap: var(--controls-spacing);
  }
  #controls .col { /* This refers to the inner .col div containing the D-pad buttons */
    display:flex;
    flex-direction:column;
    gap:var(--controls-spacing);
    align-items:center;
  }
  #controls .col > div { /* The div that wraps left/down/right buttons */
    display:flex;
    gap:var(--controls-spacing);
  }
  #controls button {
    width:var(--controls-button-size);
    height:var(--controls-button-size);
    border-radius:12px;
    font-size:22px;
    border:1px solid rgba(80,80,80,0.6);
    background: linear-gradient(45deg, #555, #333);
    color: #eee;
    box-shadow: 0 0 8px rgba(0,0,0,0.5);
    transition: all 0.2s ease-in-out;
  }
  #controls button:hover {
    background: linear-gradient(45deg, #666, #444);
    box-shadow: 0 0 12px rgba(0,0,0,0.7);
    transform: translateY(-2px);
  }

  /* Left-side action buttons container */
  #left-controls {
    position: absolute;
    left: var(--controls-side-margin);
    bottom: var(--controls-base-offset);
    display: flex;
    flex-direction: column-reverse; /* Stack from bottom up */
    gap: var(--controls-spacing);
    pointer-events: auto;
  }
  .action-button {
    width:var(--special-button-size);
    height:var(--special-button-size);
    font-size:16px;
    border-radius:14px;
    color: #fff;
    box-shadow: 0 0 10px rgba(0,0,0,0.6);
    transition: all 0.2s ease-in-out;
    cursor:pointer;
    border: none; /* Reset individual button border to be handled by specific class */
    pointer-events: auto;
  }
  .action-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 15px rgba(0,0,0,0.8);
  }

  #shootBtn {
    border: 1px solid rgba(150,50,50,0.6);
    background: linear-gradient(45deg, #8B0000, #660000);
  }
  #shootBtn:hover {
    background: linear-gradient(45deg, #A00000, #8B0000);
  }

  #orbitBtn {
    border: 1px solid rgba(100,100,100,0.6);
    background: linear-gradient(45deg, #444, #222);
  }
  #orbitBtn:hover {
    background: linear-gradient(45deg, #555, #333);
  }

  #rocketBtn {
    border: 1px solid rgba(150,100,50,0.6);
    background: linear-gradient(45deg, #A0522D, #8B4513);
  }
  #rocketBtn:hover {
    background: linear-gradient(45deg, #CD5C5C, #A0522D);
  }

  /* Shared button styles */
  .small { font-size:12px; padding:6px 8px; }
  #soundToggle {
    position:absolute;
    right:12px;
    top:12px;
    pointer-events:auto;
    border: 1px solid rgba(80,80,80,0.4);
    background: rgba(0,0,0,0.7);
    color: #ccc;
    border-radius: 8px;
    padding: 6px 10px;
    box-shadow: 0 0 5px rgba(0,0,0,0.3);
    transition: all 0.2s ease-in-out;
  }
  #soundToggle:hover {
    background: rgba(20,20,20,0.9);
    box-shadow: 0 0 8px rgba(0,0,0,0.5);
    transform: translateY(-1px);
  }
  hr { border-color: rgba(100,100,100,0.15); }
  .menu p { color: #aaa; }
  .menu a { color: #88a; text-decoration: none; }
  .menu a:hover { color: #aab; text-decoration: underline; }

  footer {
    position: fixed;
    bottom: 2px;
    width: 100%;
    text-align: center;
    font-size: 10px;
    color: #fff;
    background: transparent;
    z-index: 9999;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="menu" class="menu">
      <div class="box">
        <h1>Rᵒᵖᵖˡᵉᵈᵒˣˣᵉʳ <br> DΞΛD SHΛPΞ©</h1>
        <p><a href="https://roppledoxxer.github.io/DeadShape.LICENSE/" target="_blank" rel="noopener noreferrer">LICENSE</a></p>
        <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap">
          <button onclick="startGame('easy')">Easy</button>
          <button onclick="startGame('medium')">Medium</button>
          <button onclick="startGame('hard')">Hard</button>
          <button onclick="startGame('endless')">Endless</button>
        </div>
        <hr style="opacity:.2;margin:12px 0" />
        <div style="display:flex;gap:8px;justify-content:center">
          <label style="font-size:14px;color:#ddd">Volume</label>
          <input id="vol" type="range" min="0" max="1" step="0.01" value="0.6" style="width:140px" onchange="setVolume(this.value)" />
        </div>
        <div style="margin-top:10px;color:#ccc;font-size:13px">High Score: <span id="hs">0</span></div>
        <div style="margin-top:10px; display:flex; gap: 8px; justify-content:center;">
          <button onclick="showHow()" class="small">How to Play</button>
          <button onclick="toggleComputerMode()" id="computerModeBtn" class="small">Computer Mode: Off</button>
        </div>
      </div>
    </div>

    <div id="upgradeMenu">
      <div class="upgrade-title">Wave Complete! Choose an Upgrade</div>
      <div class="upgrade-container" id="upgradeContainer"></div>
    </div>

    <div class="hud" id="hud">Health: 3 &nbsp; Score: 0</div>
    <div class="hud" id="waveCounter">Wave: 1</div>

    <!-- Right-side D-pad controls -->
    <div id="controls">
      <div class="col">
        <button id="up">↑</button>
        <div>
          <button id="left">←</button>
          <button id="down">↓</button>
          <button id="right">→</button>
        </div>
      </div>
    </div>

    <!-- Left-side action buttons -->
    <div id="left-controls">
      <button id="rocketBtn" class="action-button">Rocket</button>
      <button id="orbitBtn" class="action-button">Orbit Blade</button>
      <button id="shootBtn" class="action-button">Shoot</button>
    </div>

    <button id="soundToggle" class="small">Sound: On</button>
  </div>
</div>

<!-- Audio placeholders (put your actual files in same folder and adjust names) -->
<audio id="bg" src="DeadShape.soundtrack.m4a" loop preload="auto"></audio>
<audio id="sndShoot" src="DeadShape.Shoot.mp3.m4a" preload="auto"></audio>
<audio id="sndHit" src="DeadShape.Dmge.mp3.m4a" preload="auto"></audio>
<audio id="sndExpl" src="explosion.wav" preload="auto"></audio>
<audio id="sndPower" src="DeadShape.Upgrade.mp3.m4a" preload="auto"></audio>
<script>
/* ===========================
   Wave-Based CircleShooter with Upgrades
   Features: enemy types, wave system, upgrade menu,
   particles, sounds, scoring, endless scaling
   =========================== */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function fit() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
fit();
addEventListener('resize', fit);

// Game state
let player = { x: innerWidth/2, y: innerHeight/2, r: 20, speed: 5, health: 3, shield:0, maxHealth: 3, damageMultiplier: 1, shieldDuration: 2 };
let enemies = [], bullets = [], particles = [];
let gameRunning = false;
let currentWave = 0;
let waveComplete = false;
let score = 0;
let highScore = parseInt(localStorage.getItem('cs_high')||'0',10);
document.getElementById('hs').innerText = highScore;
let volume = parseFloat(document.getElementById('vol').value);
let soundOn = true;
let computerModeEnabled = false;

// Audio elements
const bg = document.getElementById('bg');
const sndShoot = document.getElementById('sndShoot');
const sndHit = document.getElementById('sndHit');
const sndExpl = document.getElementById('sndExpl');
const sndPower = document.getElementById('sndPower');
function setVolume(v){
  volume = parseFloat(v);
  [bg, sndShoot, sndHit, sndExpl, sndPower].forEach(a => a.volume = volume);
}
setVolume(volume);

// control state
const keys = {};
const btnMap = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right' };
['keydown','keyup'].forEach(ev => window.addEventListener(ev, e => {
  if(ev==='keydown') keys[e.key]=true; else keys[e.key]=false;
}));

// touch buttons
['up','down','left','right'].forEach(id=>{
  const b = document.getElementById(id);
  b.addEventListener('touchstart', e=>{ keys[id]=true; e.preventDefault(); });
  b.addEventListener('touchend', e=>{ keys[id]=false; e.preventDefault(); });
  b.addEventListener('mousedown', e=>{ keys[id]=true; });
  b.addEventListener('mouseup', e=>{ keys[id]=false; });
});

// shoot button (tap)
const shootBtn = document.getElementById('shootBtn');
shootBtn.addEventListener('touchstart', e=>{ shoot(); e.preventDefault(); });
shootBtn.addEventListener('mousedown', e=>{ shoot(); });

// sound toggle
document.getElementById('soundToggle').addEventListener('click', ()=>{
  soundOn = !soundOn;
  document.getElementById('soundToggle').innerText = 'Sound: ' + (soundOn?'On':'Off');
  if(!soundOn) { bg.pause(); } else { if(gameRunning) bg.play().catch(()=>{}); }
});

// helper utilities
function rand(min,max){ return Math.random()*(max-min)+min; }
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function playSnd(a){ if(!soundOn) return; a.currentTime=0; a.play().catch(()=>{}); }

// spawn enemies far away (300-600)
function spawnEnemy(type='normal') {
  const angle = Math.random()*Math.PI*2;
  const d = 350 + Math.random()*350;
  const x = player.x + Math.cos(angle)*d;
  const y = player.y + Math.sin(angle)*d;
  let e = { x,y, size:20, speed:1 + Math.random()*0.6, type, hp:1, shooterTimer:0 };
  if(type==='fast'){ e.speed = 1.6 + Math.random()*0.6; e.size=16; e.hp=1; }
  if(type==='tank'){ e.speed = 0.6 + Math.random()*0.3; e.size=28; e.hp=3; }
  if(type==='shooter'){ e.speed = 0.9; e.size=22; e.hp=2; e.shooterTimer = rand(0,2); }
  if(type==='ranged'){ e.speed = 1.1 + Math.random()*0.4; e.size=20; e.hp=2; e.shooterTimer = rand(0,1.5); }
  enemies.push(e);
}

// initial spawn set for wave
function initWave(waveNum) {
  enemies = [];
  // scale difficulty by wave
  let baseCount = 10 + (waveNum * 3);
  for(let i=0;i<baseCount;i++){
    let r = Math.random();
    // increase difficulty with waves
    let difficultyMod = Math.min(0.3, waveNum * 0.05);
    
    let type = 'normal';
    if(r>0.92-difficultyMod) type='tank';
    else if(r>0.78-difficultyMod) type='fast';
    else if(r>0.60-difficultyMod) type='shooter';
    else if(r>0.45-difficultyMod) type='ranged';
    
    spawnEnemy(type);
  }
}

// bullets home to nearest enemy (triangles)
function shoot() {
  playSnd(sndShoot);
  bullets.push({ x:player.x, y:player.y, size:12, speed:8, vx:0, vy:0, life:6, rotation:0, damage: 1 * player.damageMultiplier });
}

// particles
function createExplosion(x,y,color,amount=18) {
  for(let i=0;i<amount;i++){
    particles.push({
      x,y,
      vx: Math.cos(Math.random()*Math.PI*2)*rand(1,4),
      vy: Math.sin(Math.random()*Math.PI*2)*rand(1,4),
      life: rand(20,50),
      color
    });
  }
}

// UI update
function updateHUD() {
  document.getElementById('hud').innerText = `Health: ${player.health}  Score: ${score}  Enemies: ${enemies.length}`;
  document.getElementById('waveCounter').innerText = `Wave: ${currentWave}`;
}

// main game loop & update
let frame=0;
function update() {
  frame++;
  // player movement hold
  if(keys['up']||keys['ArrowUp']) player.y -= player.speed;
  if(keys['down']||keys['ArrowDown']) player.y += player.speed;
  if(keys['left']||keys['ArrowLeft']) player.x -= player.speed;
  if(keys['right']||keys['ArrowRight']) player.x += player.speed;
  // clamp
  player.x = Math.max(player.r, Math.min(canvas.width-player.r, player.x));
  player.y = Math.max(player.r, Math.min(canvas.height-player.r, player.y));

  // enemies follow player
  enemies.forEach((e, idx) => {
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const d = Math.hypot(dx,dy) || 1;
    let currentEnemySpeed = e.speed;
    if (computerModeEnabled) {
      currentEnemySpeed *= 0.5;
    }
    e.x += (dx/d) * currentEnemySpeed;
    e.y += (dy/d) * currentEnemySpeed;

    // shooter & ranged enemy fire
    if(e.type==='shooter' || e.type==='ranged'){
      e.shooterTimer -= 1/60;
      if(e.shooterTimer<=0){
        e.shooterTimer = (e.type==='ranged' ? 1.5 : 2) + Math.random()*1.5;
        bullets.push({
          x: e.x, y: e.y, size:8, speed: (e.type==='ranged' ? 4.5 : 3.5),
          vx: (player.x - e.x)/d * (e.type==='ranged' ? 4.5 : 3.5), 
          vy: (player.y - e.y)/d * (e.type==='ranged' ? 4.5 : 3.5),
          hostile:true, life:6, rotation: Math.atan2(player.y-e.y, player.x-e.x)
        });
      }
    }

    // collision with player
    if(Math.abs(e.x - player.x) < (e.size/1.3 + player.r) && Math.abs(e.y - player.y) < (e.size/1.3 + player.r)){
      if(player.shield > 0){
        player.shield -= 1;
        createExplosion(e.x, e.y, 'rgba(180,220,255,0.9)', 12);
        playSnd(sndHit);
      } else {
        player.health -= 1;
        playSnd(sndHit);
      }
      e.hp -= 1;
      if(e.hp <= 0){
        createExplosion(e.x, e.y, 'orange', 24);
        playSnd(sndExpl);
        score += 10 + (e.type==='tank'?15:0) + (e.type==='fast'?5:0) + (e.type==='ranged'?8:0);
        enemies.splice(idx,1);
      } else {
        e.x -= (dx/d)*40;
        e.y -= (dy/d)*40;
      }
    }
  });

  // bullets behavior
  bullets.forEach((b,i) => {
    if(b.hostile){
      b.x += b.vx; b.y += b.vy;
      b.life--;
      if(b.life<=0) bullets.splice(i,1);
      if(Math.hypot(b.x-player.x,b.y-player.y) < player.r+6){
        if(player.shield>0) { player.shield -= 1; playSnd(sndHit); }
        else { player.health -= 1; playSnd(sndHit); }
        createExplosion(b.x,b.y,'#f55',8);
        bullets.splice(i,1);
      }
      return;
    }

    // homing to nearest enemy
    if(enemies.length>0){
      let nearest = enemies[0], nd = Math.hypot(enemies[0].x-b.x, enemies[0].y-b.y);
      for(let j=1;j<enemies.length;j++){
        let d2 = Math.hypot(enemies[j].x-b.x, enemies[j].y-b.y);
        if(d2 < nd){ nd = d2; nearest = enemies[j]; }
      }
      let dx = nearest.x - b.x, dy = nearest.y - b.y;
      let d = Math.hypot(dx,dy) || 1;
      b.vx = (dx/d) * b.speed;
      b.vy = (dy/d) * b.speed;
      b.rotation = Math.atan2(b.vy, b.vx);
      b.x += b.vx;
      b.y += b.vy;

      if(Math.abs(nearest.x - b.x) < nearest.size && Math.abs(nearest.y - b.y) < nearest.size){
        nearest.hp -= b.damage;
        createExplosion(b.x,b.y,'red',10);
        playSnd(sndExpl);
        bullets.splice(i,1);
        if(nearest.hp <= 0){
          createExplosion(nearest.x, nearest.y, 'orange', 22);
          score += 10 + (nearest.type==='tank'?15:0) + (nearest.type==='fast'?5:0) + (nearest.type==='ranged'?8:0);
          enemies.splice(enemies.indexOf(nearest),1);
        }
      }
    } else {
      b.x += b.vx || 0;
      b.y += b.vy || 0;
    }

    if(b.x < -50 || b.x > canvas.width+50 || b.y < -50 || b.y > canvas.height+50) {
      bullets.splice(i,1);
    }
  });

  // particles update
  particles.forEach((p,i) => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life--;
    if(p.life<=0) particles.splice(i,1);
  });

  // check if wave complete
  if(enemies.length === 0 && !waveComplete){
    waveComplete = true;
    gameRunning = false;
    bg.pause();
    showUpgradeMenu();
    return;
  }

  // update HUD
  updateHUD();

  // check gameover
  if(player.health <= 0){
    gameOver();
  }
}

// draw
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  let bgGradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, Math.max(canvas.width, canvas.height)/1.5);
  bgGradient.addColorStop(0, '#0a4');
  bgGradient.addColorStop(1, '#052');
  ctx.fillStyle = bgGradient;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const t = Date.now()/1000;
  const gsize = 60;
  ctx.strokeStyle = 'rgba(0,0,0,0.1)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let x = (t*5)%gsize - gsize; x < canvas.width; x+=gsize){
    ctx.moveTo(x,0); ctx.lineTo(x,canvas.height);
  }
  for(let y = (t*5)%gsize - gsize; y < canvas.height; y+=gsize){
    ctx.moveTo(0,y); ctx.lineTo(canvas.width,y);
  }
  ctx.stroke();

  // draw enemies (squares)
  enemies.forEach(e=>{
    let enemyGradient;
    if(e.type === 'tank'){
      enemyGradient = ctx.createLinearGradient(e.x-e.size/2, e.y, e.x+e.size/2, e.y);
      enemyGradient.addColorStop(0, '#8B0000');
      enemyGradient.addColorStop(1, '#FF4500');
    } else if (e.type === 'fast'){
      enemyGradient = ctx.createLinearGradient(e.x-e.size/2, e.y, e.x+e.size/2, e.y);
      enemyGradient.addColorStop(0, '#00CED1');
      enemyGradient.addColorStop(1, '#00FFFF');
    } else if (e.type === 'shooter'){
      enemyGradient = ctx.createLinearGradient(e.x-e.size/2, e.y, e.x+e.size/2, e.y);
      enemyGradient.addColorStop(0, '#4B0082');
      enemyGradient.addColorStop(1, '#9400D3');
    } else if (e.type === 'ranged'){
      enemyGradient = ctx.createLinearGradient(e.x-e.size/2, e.y, e.x+e.size/2, e.y);
      enemyGradient.addColorStop(0, '#FF6347');
      enemyGradient.addColorStop(1, '#FF1493');
    } else {
      enemyGradient = ctx.createLinearGradient(e.x-e.size/2, e.y, e.x+e.size/2, e.y);
      enemyGradient.addColorStop(0, '#FFA500');
      enemyGradient.addColorStop(1, '#FFD700');
    }
    ctx.fillStyle = enemyGradient;
    ctx.shadowBlur = 8;
    ctx.shadowColor = 'rgba(255,165,0,0.8)';
    ctx.fillRect(e.x - e.size/2, e.y - e.size/2, e.size, e.size);
    ctx.shadowBlur = 0;

    // HP bar
    if(e.hp>1){
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(e.x - e.size/2, e.y - e.size/2 - 8, e.size, 4);
      ctx.fillStyle = '#0f0';
      let maxHp = e.type==='tank'?3:e.type==='shooter'?2:e.type==='ranged'?2:1;
      ctx.fillRect(e.x - e.size/2, e.y - e.size/2 - 8, (e.hp / maxHp) * e.size, 4);
    }
  });

  // draw bullets
  bullets.forEach(b=>{
    ctx.save();
    ctx.translate(b.x, b.y);
    const ang = b.rotation || Math.atan2(b.vy||0, b.vx||1);
    ctx.rotate(ang + Math.PI/2);
    
    let bulletGradient;
    if (b.hostile) {
      bulletGradient = ctx.createLinearGradient(0, -b.size/2, 0, b.size/2);
      bulletGradient.addColorStop(0, '#FF6347');
      bulletGradient.addColorStop(1, '#8B0000');
    } else {
      bulletGradient = ctx.createLinearGradient(0, -b.size/2, 0, b.size/2);
      bulletGradient.addColorStop(0, '#FFFF00');
      bulletGradient.addColorStop(1, '#FFD700');
    }
    ctx.fillStyle = bulletGradient;
    ctx.shadowBlur = 8;
    ctx.shadowColor = b.hostile ? '#FF6347' : '#FFFF00';
    ctx.beginPath();
    ctx.moveTo(0, -b.size/2);
    ctx.lineTo(-b.size/2, b.size/2);
    ctx.lineTo(b.size/2, b.size/2);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  });

  // draw player
  let playerGradient = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, player.r);
  playerGradient.addColorStop(0, 'white');
  playerGradient.addColorStop(0.5, 'lightblue');
  playerGradient.addColorStop(1, 'deepskyblue');
  ctx.fillStyle = playerGradient;
  ctx.shadowBlur = 15;
  ctx.shadowColor = 'deepskyblue';
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  if(player.shield>0){
    ctx.strokeStyle = 'rgba(200,220,255,0.9)';
    ctx.lineWidth = 6;
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'white';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r+8, 0, Math.PI*2);
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.shadowBlur = 0;
  }

  // draw particles
  particles.forEach(p=>{
    ctx.fillStyle = p.color || 'white';
    ctx.globalAlpha = Math.max(0, p.life/60);
    ctx.shadowBlur = 5;
    ctx.shadowColor = p.color || 'white';
    ctx.fillRect(p.x, p.y, 3, 3);
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  });
}

// main game tick
function loop() {
  if(!gameRunning) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

// Upgrade system
const upgradeData = [
  { name: 'Health Boost', desc: '+1 Max Health', chance: 30, apply: () => { player.maxHealth++; player.health = Math.min(player.health + 1, player.maxHealth); } },
  { name: 'Speed Boost', desc: '+0.8 Movement Speed', chance: 25, apply: () => { player.speed += 0.8; } },
  { name: 'Shield Duration', desc: '+1 Shield Capacity', chance: 20, apply: () => { player.shieldDuration++; } },
  { name: 'Attack Damage', desc: '+0.5x Damage Multiplier', chance: 25, apply: () => { player.damageMultiplier += 0.5; } }
];

function selectRandomUpgrades() {
  let selected = [];
  let attempts = 0;
  while(selected.length < 2 && attempts < 20) {
    let randUpgrade = upgradeData[Math.floor(Math.random() * upgradeData.length)];
    if(!selected.includes(randUpgrade) && Math.random() * 100 < randUpgrade.chance) {
      selected.push(randUpgrade);
    }
    attempts++;
  }
  while(selected.length < 2) {
    let randUpgrade = upgradeData[Math.floor(Math.random() * upgradeData.length)];
    if(!selected.includes(randUpgrade)) {
      selected.push(randUpgrade);
    }
  }
  return selected;
}

function showUpgradeMenu() {
  const upgrades = selectRandomUpgrades();
  const container = document.getElementById('upgradeContainer');
  container.innerHTML = '';
  
  upgrades.forEach((upgrade, idx) => {
    const option = document.createElement('div');
    option.className = 'upgrade-option';
    option.innerHTML = `
      <div class="name">${upgrade.name}</div>
      <div class="description">${upgrade.desc}</div>
      <div class="chance">Rarity: ${upgrade.chance}%</div>
    `;
    option.onclick = () => {
      upgrade.apply();
      document.getElementById('upgradeMenu').classList.remove('active');
      continueToNextWave();
    };
    container.appendChild(option);
  });
  
  document.getElementById('upgradeMenu').classList.add('active');
}

function continueToNextWave() {
  currentWave++;
  waveComplete = false;
  enemies = [];
  bullets = [];
  particles = [];
  initWave(currentWave);
  
  player.x = canvas.width/2;
  player.y = canvas.height/2;
  
  if(soundOn){ bg.currentTime=0; bg.play().catch(()=>{}); }
  gameRunning = true;
  requestAnimationFrame(loop);
}

// start game functions
function startGame(diff) {
  document.getElementById('menu').style.display='none';
  document.getElementById('upgradeMenu').classList.remove('active');
  
  enemies=[]; bullets=[]; particles=[];
  player.x = canvas.width/2; 
  player.y = canvas.height/2; 
  player.shield=0;
  player.health=3;
  player.maxHealth=3;
  player.speed=5;
  player.damageMultiplier=1;
  score = 0;
  currentWave = 1;
  waveComplete = false;
  
  if(diff==='easy'){ player.health=5; player.maxHealth=5; player.speed=6; }
  else if(diff==='medium'){ player.health=3; player.maxHealth=3; player.speed=5; }
  else if(diff==='hard'){ player.health=2; player.maxHealth=2; player.speed=5.2; }
  else if(diff==='endless'){ player.health=3; player.maxHealth=3; player.speed=5; }
  
  initWave(currentWave);
  
  if(soundOn){ bg.currentTime=0; bg.play().catch(()=>{}); }
  gameRunning = true;
  requestAnimationFrame(loop);
}

// game over
function gameOver() {
  gameRunning = false;
  bg.pause();
  if(score > highScore){
    highScore = score;
    localStorage.setItem('cs_high', highScore.toString());
    alert(`Game Over!\nWave: ${currentWave}\nNew High Score: ${score}`);
  } else {
    alert(`Game Over!\nWave: ${currentWave}\nScore: ${score}\nHigh Score: ${highScore}`);
  }
  location.reload();
}

// show how to play
function showHow(){
  alert("HOW TO PLAY:\n- Use arrow buttons (hold) to move.\n- Tap SHOOT to fire homing triangles.\n- Use Orbit Blade and Rocket for special attacks.\n- Survive waves and choose upgrades!\n- Each wave gets harder but you get stronger!");
}

// toggle computer mode
function toggleComputerMode() {
  computerModeEnabled = !computerModeEnabled;
  document.getElementById('computerModeBtn').innerText = 'Computer Mode: ' + (computerModeEnabled ? 'On' : 'Off');
}

// initial UI bindings
function setupUI(){
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ bg.pause(); } else if(gameRunning && soundOn) bg.play().catch(()=>{});
  });
}
setupUI();

// simple auto-fire cooldown
let shootCooldown = false;
setInterval(()=>shootCooldown=false, 120);

const origShoot = shoot;
shoot = function(){
  if(shootCooldown) return;
  shootCooldown = true;
  origShoot();
};

// expose start functions to buttons
window.startGame = startGame;
window.setVolume = setVolume;
window.showHow = showHow;
window.toggleComputerMode = toggleComputerMode;

// periodic score reward
setInterval(()=>{
  if(!gameRunning) return;
  score += 1;
}, 1000);

/* ====== Orbit Blade + Rocket ====== */
let orbitBlade = null;
let orbitCooldown = false;
let rocketCooldown = false;
let rockets = [];

document.getElementById('orbitBtn').addEventListener('click', ()=>{
  if(orbitCooldown || orbitBlade) return;
  orbitBlade = { angle:0, progress:0, speed:0.3, radius: player.r*1.5 };
  orbitCooldown = true;
  setTimeout(()=>{ orbitCooldown=false; }, 3000);
});

document.getElementById('rocketBtn').addEventListener('click', ()=>{
  if(rocketCooldown) return;
  rocketCooldown = true;
  setTimeout(()=>{ rocketCooldown=false; }, 3000);
  if(enemies.length>0){
    let nearest = enemies[0];
    let nd = Math.hypot(nearest.x-player.x, nearest.y-player.y);
    for(let j=1;j<enemies.length;j++){
      let d2 = Math.hypot(enemies[j].x-player.x, enemies[j].y-player.y);
      if(d2<nd){ nd=d2; nearest=enemies[j]; }
    }
    const dx = nearest.x - player.x;
    const dy = nearest.y - player.y;
    const dist = Math.hypot(dx,dy) || 1;
    rockets.push({
      x: player.x,
      y: player.y,
      vx: (dx/dist)*6,
      vy: (dy/dist)*6,
      size:14
    });
  }
});

// update orbit blade and rockets
const origUpdate = update;
update = function() {
  origUpdate();

  if(orbitBlade){
    orbitBlade.angle += orbitBlade.speed;
    orbitBlade.progress += orbitBlade.speed;
    const ox = player.x + Math.cos(orbitBlade.angle)*orbitBlade.radius;
    const oy = player.y + Math.sin(orbitBlade.angle)*orbitBlade.radius;
    enemies.forEach((e, idx)=>{
      if(Math.abs(e.x-ox)<e.size && Math.abs(e.y-oy)<e.size){
        e.hp -= 1;
        createExplosion(ox,oy,'#888',6);
        playSnd(sndExpl);
        if(e.hp<=0){
          createExplosion(e.x,e.y,'orange',22);
          score += 10 + (e.type==='tank'?15:0) + (e.type==='fast'?5:0) + (e.type==='ranged'?8:0);
          enemies.splice(idx,1);
        }
      }
    });
    if(orbitBlade.progress >= Math.PI*2){
      orbitBlade = null;
    }
  }

  // rockets
  rockets.forEach((r, idx) => {
    r.x += r.vx;
    r.y += r.vy;
    enemies.forEach((e, eidx) => {
      if(Math.hypot(e.x - r.x, e.y - r.y) < e.size + r.size){
        e.hp -= 3;
        createExplosion(r.x, r.y, '#ff8800', 20);
        playSnd(sndExpl);
        rockets.splice(idx, 1);
        if(e.hp <= 0){
          createExplosion(e.x, e.y, 'orange', 25);
          score += 10 + (e.type==='tank'?20:0) + (e.type==='fast'?5:0) + (e.type==='ranged'?10:0);
          enemies.splice(eidx, 1);
        }
      }
    });
    if(r.x < -50 || r.x > canvas.width+50 || r.y < -50 || r.y > canvas.height+50){
      rockets.splice(idx, 1);
    }
  });
};

// draw rockets
const origDraw = draw;
draw = function() {
  origDraw();
  rockets.forEach(r => {
    ctx.fillStyle = '#ff8800';
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#ff8800';
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.size/2, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  if(orbitBlade){
    const ox = player.x + Math.cos(orbitBlade.angle)*orbitBlade.radius;
    const oy = player.y + Math.sin(orbitBlade.angle)*orbitBlade.radius;
    ctx.fillStyle = '#4488ff';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#4488ff';
    ctx.beginPath();
    ctx.arc(ox, oy, 12, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
};
</script>
